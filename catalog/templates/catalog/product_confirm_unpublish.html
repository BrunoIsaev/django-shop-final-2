{% extends 'catalog/base.html' %}

{% block title %}Снять с публикации{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <div class="card">
                <div class="card-body">
                    <h2 class="card-title">Снять с публикации?</h2>
                    <p>Вы уверены, что хотите снять с публикации товар "<strong>{{ product.name }}</strong>"?</p>
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-warning">Да, снять с публикации</button>
                        <a href="{% url 'home' %}" class="btn btn-secondary">Отмена</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
